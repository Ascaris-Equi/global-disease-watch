<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050607'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%238C1C1C' stroke-width='2'/%3E%3C/svg%3E">
<title>全球传染病监测 · GLOBAL WATCH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">

  <canvas id="globe" width="1000" height="1080"></canvas>
  <div class="measure" aria-hidden="true"></div>

  <section class="hero" aria-live="off">
    <div class="kicker" data-t="focus"></div>
    <div class="rank" id="heroRank"></div>
    <h1 class="country" id="heroCountry">—</h1>
    <div class="disease" id="heroDisease"></div>
    <div class="meta" id="heroMeta"></div>
    <div class="signal-bar" aria-hidden="true"></div>
    <div class="big-label" id="bigLabel"></div>
    <div class="big"><span id="bigValue">—</span><span class="unit" id="bigUnit"></span></div>
    <div class="hair hr1" aria-hidden="true"></div>
    <div class="kv v1"><span class="k" data-t="reported"></span><span class="v" id="valCases">—</span></div>
    <div class="kv v2"><span class="k" data-t="cfr"></span><span class="v" id="valCfr">—</span></div>
    <div class="hair hr2" aria-hidden="true"></div>
    <div class="att-label" data-t="attention"></div>
    <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="att-level" id="attLevel"></div>
    
    <dl class="facts">
      <dt data-t="reportDate"></dt><dd id="factDate">—</dd>
      <dt data-t="asOf"></dt><dd id="factAsOf">—</dd>
      <dt data-t="dataSource"></dt><dd id="factSource">—</dd>
    </dl>
    <div class="arc-note" data-t="arcNote"></div>
  </section>

  <section class="watch">
    <div class="watch-kicker" data-t="watchKicker"></div>
    <h2 class="watch-title" data-t="watchTitle"></h2>
    <div class="watch-sort" data-t="rankedBy"></div>
    <div class="watch-rule wr1" aria-hidden="true"></div>
    <div class="watch-head">
      <span class="c-country" data-t="colCountry"></span>
      <span class="c-disease" data-t="colDisease"></span>
      <span class="c-cases" data-t="colCases"></span>
      <span class="c-deaths" data-t="colDeaths"></span>
      <span class="c-date" data-t="colReported"></span>
      <span class="c-level" data-t="colAttention"></span>
    </div>
    <div class="watch-rule wr2" aria-hidden="true"></div>
    <div id="rows"></div>
    <div class="watch-rule wr3" aria-hidden="true"></div>
    <div class="watch-foot" id="watchFoot"></div>
    <div class="watch-rule wr4" aria-hidden="true"></div>
  </section>

  <div class="chain-panel" aria-hidden="true"></div>
  <div class="chain-kicker" data-t="transmission"></div>
  <div class="chain-graph" id="chainGraph">
    <svg class="chain-edges" id="chainEdges" width="398" height="422" viewBox="0 0 398 422" aria-hidden="true"></svg>
    <div class="chain-nodes" id="chainNodes"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="chain-title" id="chainTitle"></div>

  <header class="bar top">
    <div class="brand"><span class="brand-name" data-t="brand"></span><span class="brand-tag" data-t="brandTag"></span></div>
    <div class="agencies" data-t="agencies"></div>
  </header>
  <footer class="bar bottom">
    <div class="clock" id="clock"></div>
    <div class="sync" id="syncLine"></div>
  </footer>

  <div class="corner tl" aria-hidden="true"></div>
  <div class="corner tr" aria-hidden="true"></div>
  <div class="corner bl" aria-hidden="true"></div>
  <div class="corner br" aria-hidden="true"></div>

</div>

<script src="app.js"></script>
</body>
</html>
